; Flex & Rest firmware — ESP32-S3 DevKitC-1, Arduino framework
; All files live in one flat folder, so only the two firmware sources are compiled.
[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/DHT sensor library@^1.4.6
build_src_filter = -<*> +<main.cpp> +<thermal_core.cpp>
build_flags =
  -D FLEXREST_SIMULATE_ACTUATOR=1      ; 0 = drive the real TEC (read hardware_safety.md first)
